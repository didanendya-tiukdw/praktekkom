<!DOCTYPE html>
<!-- Deklarasi DOCTYPE: dokumen ini menggunakan standar HTML5 -->
<html lang="id">
  <!-- lang="id": bahasa utama konten adalah bahasa Indonesia -->
  <head>
    <!-- Pengodean karakter; letakkan paling awal di dalam <head> -->
    <meta charset="UTF-8">
    <!-- Agar halaman menyesuaikan lebar layar perangkat (mobile) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Ringkasan halaman untuk mesin pencari -->
    <meta name="description" content="Halaman pertama praktikum HTML">
    <meta name="author" content="Nama Mahasiswa">
    <!-- Judul yang tampil pada tab browser dan hasil pencarian -->
    <title>Halaman Pertama Saya</title>
  </head>
  <body>
    <!-- Seluruh konten yang tampil di browser berada di dalam <body> -->
    <h1>Halo, Dunia Web!</h1>
    <p>Ini adalah halaman HTML pertama saya pada Praktikum Teknologi Komputer.</p>
  </body>
</html>
